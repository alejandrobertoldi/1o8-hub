# Topic routing map, Content Specialist layer.
# Read by auto-load-topics.sh (UserPromptSubmit), inject-related-context.sh
# (post-compact resume), and session-reset.sh (path validation, advisory).
#
# Format contract (do not change without re-reading the three hooks):
#   - A keyword line is `keyword:` or `"multi word keyword":` with NOTHING after
#     the colon. Keys must be lowercase (inject-related-context.sh greps
#     lowercase keys only). No digits or slashes in keys.
#   - Each file line is exactly two spaces, a dash, a space, then a path
#     relative to the project root. Every path must exist on disk;
#     session-reset.sh warns on any that do not.

newsletter:
  - newsletter/README.md
  - newsletter/foundations/VOICE.md
